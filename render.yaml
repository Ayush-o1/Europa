# Europa — Render Infrastructure-as-Code Blueprint
# Defines the web application service and managed PostgreSQL database.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: europa-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: europa-db
          property: connectionString
      - key: OPERATOR_API_KEY
        generateValue: true
      - key: STORAGE_DIR
        value: ./storage/snapshots
      - key: CORRELATION_STEP_TOLERANCE_MINUTES
        value: '20'
      - key: CORRELATION_MAX_CUMULATIVE_DRIFT_MINUTES
        value: '45'

databases:
  - name: europa-db
    databaseName: europa
    user: europa_user
    plan: starter
    region: oregon
    postgresMajorVersion: '16'
