name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & End-to-End Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: europa_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PGUSER: postgres
      DATABASE_URL: postgresql://postgres@localhost:5432/europa_test
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/europa_test
      OPERATOR_API_KEY: test-operator-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Lint source code (ESLint)
        run: npm run lint

      - name: Run database schema migrations
        run: npm run db:migrate

      - name: Run unit and integration tests (Vitest)
        run: npm test

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end workflows (Playwright)
        run: npm run test:e2e

      - name: Upload E2E test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
